cv:
  name: Jonathan Lys
  email: jonathan.lys@imt-atlantique.org
  website: https://jonathanlys01.github.io
  summary: >
    Third year PhD student at IMT Atlantique. Previously research intern in the Criteo AI Lab.
    Computer Vision, Natural Language Processing and Deep Learning enthusiast.
    I like to optimize the training and the generation of large language models and diffusion models.
  location:
    city: Brest
    region: Bretagne
    country: France

  sections:
    Experience:
      - company: Sony Europe, Stuttgart, Germany
        position: Visiting Scientist
        start_date: 2024
        end_date: 2025
        summary: "Two visits to EUREC, total of 3 months."
        highlights:
          - "Worked on conditional generation for text diffusion models."
          - "Studied looped AR LLMs for reasoning tasks."

      - company: Criteo AI Lab, Paris, France
        position: Research Intern
        start_date: "2024-04"
        end_date: "2024-10"
        summary: "Studied diffusion models, for image background generation.<br> Supervised by Jaspreet Sandhu, Thibaut Issenhuth, Ludovic Dos Santos"
        highlights:
          - "Trained large-scale diffusion models up to 6B parameters."
          - "Developed an ad background generation pipeline, reducing object extension by 10×, achieving lowest FID and fast inference."
          - "Worked on billions of product images, leveraging PySpark and distributed training."

      - company: IMT Atlantique, BRAIN Team, Brest, France
        position: Research Intern
        start_date: 2023
        end_date: 2023
        summary: "Studied PEFT methods for SAM and attention-based data augmentation techniques. <br> Supervised by Bastien Pasdeloup."
        highlights:
          - "Matched the performance of full fine-tuning with a custom LoRA method."
          - "Improved the performance of CNNs through attention-based data augmentation."

      - company: French Polynesia’s government IT Department, Papeete, French Polynesia
        position: Developer Intern
        start_date: 2022
        end_date: 2022
        summary: "Development of a Web application for network management, automation of database migrations."

    Education:
      - degree: PhD in Computer Science
        institution: IMT Atlantique – BRAIn team, Brest
        start_date: 2024
        end_date: 2027
        highlights:
          - "Studying discrete diffusion models for text generation and diversity-aware sampling strategies."
          - "Co-authored a NeurIPS paper on foundation model for EEG and worked on its release."
          - "Served as a reviewer for ICML (Silver Reviewer Award)."

      - degree: M.Sc. Engineering Sciences and Applications
        institution: University of Rennes 1, Rennes
        start_date: 2023
        end_date: 2024
        highlights:
          - "Double Degree SIVOS in Engineering, jointly accredited by Rennes 1 and CentraleSupélec."
          - "Specializing in Signal, Image, and Vision. Graduated with high honours."

      - degree: Postgraduate Study Abroad
        institution: University of Technology Sydney, Australia
        start_date: "2023-02"
        end_date: "2023-06"
        highlights:
          - "Academic exchange: Deep learning and convolutional neural networks, computational intelligence, IT projects management, decision-making for engineers."

      - degree: Engineering Degree
        institution: IMT Atlantique, Brest
        start_date: 2021
        end_date: 2024
        highlights:
          - "Specializations: Digital Transformation and Innovation, then Mathematical and Computational Engineering."
          - "Coursework in machine learning, stochastic modeling, numerical methods, deep learning, data science, and computer science."

